<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub User Finder</title>
  <link rel="stylesheet" href="style.css">
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" 
    referrerpolicy="no-referrer" 
  />
</head>
<body>
<div class="container">

  <header>
    <h1><i class="fab fa-github"></i> GitHub User Finder</h1>
    <p>Search for any GitHub user to see their profile and repositories</p>
  </header>
  
  <div class="serch-container">
    <input 
      type="text" 
      id="search" 
      placeholder="Enter a GitHub username..."
      autocomplete="off"
    >
    <button id="search-btn">Search</button>
  </div>

  <div id="profile-container" class="hidden">

    <div class="profile-header">
      <img src="" alt="Profile avatar" id="avatar">
      <div class="profile-info">
        <h2 id="name">title</h2>
        <p id="username">@fake</p>
        <p id="bio">no bio</p>
        <div class="location-date">
          <p>
            <i class="fas fa-map-marker-alt"></i>
            <span id="location">No specified</span>
          </p>
          <p>
            <i class="fa fa-calendar-alt"></i>
            Joined
            <span id="joined-date"></span>
          </p>
        </div>
        <a target="_blank" id="profile-link" class="btn">View Profile</a>
      </div> 
    </div>

    <div class="stats">
      <div class="stat">
        <i class="fas fa-users"></i>
        <span id="followers"></span> followers
      </div>

      <div class="stat">
        <i class="fas fa-user-friends"></i>
        <span id="following"></span> following
      </div>

      <div class="stat">
        <i class="fas fa-code-branch"></i>
        <span id="repos"></span> repositories
      </div>
    </div>

    <div class="additional-info">
      <div id="company-container" class="info-item">
        <i class="fas fa-building"></i>
        <span id="company">a</span>
      </div>

      <div id="blog-container" class="info-item">
        <i class="fas fa-link"></i>
        <a target="_blank" id="blog">b</a>
      </div>

      <div id="twitter-container" class="info-item">
        <i class="fab fa-twitter"></i>
        <a target="_blank" id="twitter">c</a>
      </div>
    </div>

    <div class="repos-section">
      <h3>Lastest Repositories</h3>
      <div class="repos-container" id="repos-container">
        <!--All Repositories-->

        <div class="loading-repos">Loading Repositories...</div>
      </div>
    </div>
  </div>

  <div id="error-container" class="hidden">
    <p>No user found. Please enter another username.</p>
  </div>
   
</div>
  <script src="script.js"></script>
</body>
</html>
